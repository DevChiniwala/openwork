name: Setup OpenWork tests
description: Install the pinned runtimes, engine, and both workspaces
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.22.1

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0

    # The product starts OpenCode v2 itself and would download and verify this
    # same pinned artifact on first use. Installing it once onto PATH (the
    # server's second resolution step) keeps every test profile from
    # downloading it again.
    - name: Install pinned OpenCode v2
      shell: bash
      run: |
        set -euo pipefail

        arch="$(uname -m)"
        case "${RUNNER_OS}" in
          Linux)
            if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then platform="linux-arm64"; else platform="linux-x64-baseline"; fi
            ;;
          macOS)
            if [ "$arch" = "arm64" ]; then platform="darwin-arm64"; else platform="darwin-x64-baseline"; fi
            ;;
          *)
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        tmp_dir="$RUNNER_TEMP/opencode2"
        rm -rf "$tmp_dir"
        mkdir -p "$tmp_dir"
        url="$(node -e 'const c=require("./constants.json"); const a=require("./apps/server/src/opencode-v2-artifacts.json"); if (a.version !== c.opencodeV2Version) throw new Error("OpenCode v2 artifact pin does not match constants.json"); const p=a.platforms[process.argv[1]]; if (!p) throw new Error("No OpenCode v2 artifact for " + process.argv[1]); process.stdout.write(p.url)' "$platform")"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp_dir/opencode2.tgz" "$url"
        node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); const a=require("./apps/server/src/opencode-v2-artifacts.json"); const actual="sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[2])).digest("base64"); if (actual !== a.platforms[process.argv[1]].integrity) throw new Error("OpenCode v2 archive integrity mismatch")' "$platform" "$tmp_dir/opencode2.tgz"
        tar -xzf "$tmp_dir/opencode2.tgz" -C "$tmp_dir" package/bin/opencode

        install_dir="$HOME/.opencode2/bin"
        mkdir -p "$install_dir"
        install -m 0755 "$tmp_dir/package/bin/opencode" "$install_dir/opencode2"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify OpenCode v2
      shell: bash
      run: |
        set -euo pipefail
        expected="$(node -p 'require("./constants.json").opencodeV2Version')"
        actual="$(opencode2 --version | sed -E 's/^opencode v?//')"
        if [ "$actual" != "$expected" ]; then
          echo "opencode2 is $actual; constants.json pins $expected." >&2
          exit 1
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install eval workspace
      shell: bash
      run: pnpm --dir evals install --frozen-lockfile --prefer-offline
