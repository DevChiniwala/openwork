name: CodeQL

# Advanced setup replacing GitHub's CodeQL default setup. Default setup builds
# Swift with autobuild on every PR, which waits for a macOS runner and spends
# ~8 minutes discovering the build before compiling. Here Swift is built
# directly, and only when the Swift package changes. Every other language is
# analyzed without a build on every PR, push and schedule.
#
# Default setup must be disabled for this workflow's uploads to be accepted.
# See docs/codeql-results.md.

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("swift", "true");
              return;
            }
            // Keep in sync with swiftPaths in scripts/ci/check-codeql-results.mjs.
            const swiftPaths = ["packages/computer-use/native/", ".github/workflows/codeql.yml"];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files.some((file) => [file.filename, file.previous_filename]
              .some((name) => name && swiftPaths.some((path) => name.startsWith(path))));
            core.info(changed ? "Swift sources changed; Swift will be analyzed." : "No Swift changes; skipping Swift analysis.");
            core.setOutput("swift", String(changed));

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # Swift needs macOS (AppKit). When Swift is skipped, its leg finishes on
    # Linux in seconds instead of waiting for a macOS runner.
    runs-on: ${{ matrix.language == 'swift' && needs.changes.outputs.swift == 'true' && 'blacksmith-12vcpu-macos-15' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.language == 'swift' && 45 || 30 }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
    env:
      RUN_ANALYSIS: ${{ matrix.language != 'swift' || needs.changes.outputs.swift == 'true' }}
    steps:
      - name: Skip Swift
        if: env.RUN_ANALYSIS != 'true'
        run: echo "No changes under packages/computer-use/native; Swift is analyzed on dev pushes and the weekly schedule."

      - name: Checkout repository
        if: env.RUN_ANALYSIS == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: env.RUN_ANALYSIS == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL traces this compile. Building the one SwiftPM product directly
      # skips autobuild's project discovery.
      - name: Build Swift
        if: env.RUN_ANALYSIS == 'true' && matrix.language == 'swift'
        run: swift build --package-path packages/computer-use/native --product ComputerUse

      - name: Perform CodeQL Analysis
        if: env.RUN_ANALYSIS == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
